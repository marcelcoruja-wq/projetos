    :root {

      --accent: #38bdf8;

      --green: #22c55e;

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; padding: 20px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

    .nav-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .tab-btn:hover { color: var(--text-main); background: var(--bg-secondary); }
    .tab-btn.active { background: var(--accent); color: #000; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: var(--bg-secondary); padding: 18px; border-radius: var(--radius); border: 1px solid var(--border); }
    .card-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .card-value { font-size: 1.4rem; font-weight: 700; }
    .card-value.green { color: var(--green); }
    .card-value.red { color: var(--red); }
    .card-value.purple { color: var(--purple); }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 10px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); }
    input:focus, select:focus { outline: 1px solid var(--accent); }

    .checkbox-group { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    .checkbox-item { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.9rem; }
    .checkbox-item input { width: auto; }

    .btn { background: var(--accent); color: #000; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--bg-card); color: var(--text-main); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: var(--red); color: #fff; }

    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
